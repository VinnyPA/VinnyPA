<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-label="vinny://kernel.boot — Vinny Alves · Assistente de TI · ADS concluído, Engenharia da Computação em andamento · web full-stack, infra e hardware · Piracaia, SP">
  <title>vinny://kernel.boot</title>
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="20%" cy="0%" r="120%">
      <stop offset="0" stop-color="#0d1a14"/>
      <stop offset="0.45" stop-color="#0a0d14"/>
      <stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.018"/>
    </pattern>
    <!-- uma máscara por linha: a largura cresce = efeito de digitação -->
    <clipPath id="l1"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="860" dur="0.9s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="860" dur="0.6s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="860" dur="0.7s" begin="2.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="860" dur="0.8s" begin="3.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="860" dur="1.0s" begin="4.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="860" dur="0.9s" begin="5.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="860" dur="0.6s" begin="6.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l8"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="860" dur="1.4s" begin="7.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- moldura do terminal -->
  <rect x="1" y="1" width="858" height="348" rx="10" fill="url(#bg)" stroke="#1f2738" stroke-width="1.5"/>
  <rect x="1" y="1" width="858" height="348" rx="10" fill="url(#scan)"/>
  <path d="M1 44 H859" stroke="#1f2738" stroke-width="1"/>
  <circle cx="26" cy="23" r="5" fill="#39ff8b" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
    <text x="42" y="28" font-size="14" font-weight="700" fill="#39ff8b" letter-spacing="0.5">VINNY://kernel</text>
    <text x="834" y="28" font-size="12" fill="#5a6373" text-anchor="end">0x001</text>

    <g font-size="15.5">
      <text x="30" y="82" fill="#1fbf66" clip-path="url(#l1)">&gt; vinny://kernel.boot — pulso 0001</text>
      <text x="30" y="110" fill="#5a6373" clip-path="url(#l2)">&gt; carregando perfil...</text>

      <g clip-path="url(#l3)"><text x="30" y="146" fill="#8a96a8">&gt; nome ......... <tspan fill="#d6e1ee" font-weight="700">Vinny Alves</tspan></text></g>
      <g clip-path="url(#l4)"><text x="30" y="174" fill="#8a96a8">&gt; função ....... <tspan fill="#d6e1ee">assistente_de_ti</tspan> <tspan fill="#39ff8b">[ativo]</tspan></text></g>
      <g clip-path="url(#l5)"><text x="30" y="202" fill="#8a96a8">&gt; formação ..... <tspan fill="#d6e1ee">ads</tspan> <tspan fill="#39ff8b">✓</tspan>  <tspan fill="#d6e1ee">eng_computação</tspan> <tspan fill="#3bb6ff">em andamento</tspan></text></g>
      <g clip-path="url(#l6)"><text x="30" y="230" fill="#8a96a8">&gt; foco ......... <tspan fill="#d6e1ee">web full-stack · infra · hardware</tspan></text></g>
      <g clip-path="url(#l7)"><text x="30" y="258" fill="#8a96a8">&gt; base ......... <tspan fill="#d6e1ee">piracaia — sp</tspan></text></g>

      <g clip-path="url(#l8)"><text x="30" y="306" fill="#d6e1ee" font-weight="700" filter="url(#glow)">...alguma coisa está sendo construída.<tspan fill="#39ff8b" fill-opacity="0" font-weight="400"> ▼<set attributeName="fill-opacity" to="1" begin="9.3s"/><animate attributeName="fill-opacity" values="1;0;1" dur="1.1s" begin="9.3s" repeatCount="indefinite"/></tspan></text></g>
    </g>
  </g>
</svg>
